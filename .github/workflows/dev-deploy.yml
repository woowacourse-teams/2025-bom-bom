name: Backend Dev Server CI

on:
  push:
    branches:
      - server-dev

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ./backend/bom-bom-server

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: application.yml(메인/테스트) 생성
        shell: bash
        env:
          APPLICATION_DEV_PROPERTIES: ${{ secrets.APPLICATION_DEV_PROPERTIES }}
          APPLICATION_TEST_PROPERTIES: ${{ secrets.APPLICATION_TEST_PROPERTIES }}
        run: |
          mkdir -p src/main/resources src/test/resources
          printf '%s' "${APPLICATION_DEV_PROPERTIES:-}" > src/main/resources/application.yml
          printf '%s' "${APPLICATION_TEST_PROPERTIES:-}" > src/test/resources/application.yml
          for key in DISCORD_WEBHOOK_NEW_MEMBER DISCORD_WEBHOOK_OPERATION_ERROR DISCORD_WEBHOOK_INQUIRY; do
            if ! grep -Fq "\${$key}" src/main/resources/application.yml; then
              echo "APPLICATION_DEV_PROPERTIES must reference \${$key}" >&2
              exit 1
            fi
          done
          if grep -Eq 'https?://(discord(app)?\.com)/api/webhooks/' src/main/resources/application.yml; then
            echo "Discord webhook URL must not be embedded in the application config or image" >&2
            exit 1
          fi

      - name: 빌드 및 테스트
        shell: bash
        env:
          SPRING_PROFILES_ACTIVE: test
          DISCORD_WEBHOOK_NEW_MEMBER: https://example.invalid/discord/new-member
          DISCORD_WEBHOOK_OPERATION_ERROR: https://example.invalid/discord/operation-error
          DISCORD_WEBHOOK_INQUIRY: https://example.invalid/discord/inquiry
          APPLE_P8_ESCAPED: ${{ secrets.APPLE_P8_ESCAPED }}
        run: |
          export OAUTH2_APPLE_PRIVATE_KEY="$(printf '%b' "${APPLE_P8_ESCAPED:?APPLE_P8_ESCAPED 시크릿이 없습니다}")"
          ./gradlew build --no-daemon
    
      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: DockerHub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시
        run: |
          if ! docker buildx inspect ci-builder &>/dev/null; then
            docker buildx create --use --name ci-builder
          else
            docker buildx use ci-builder
          fi
          docker buildx build \
            --platform linux/arm64,linux/amd64 \
            --cache-from=type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/bom-bom:buildcache \
            --cache-to=type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/bom-bom:buildcache,mode=max \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/bom-bom:latest \
            --push .

  deploy:
    needs: build
    runs-on: [ self-hosted, dev-new-1 ]
    environment: dev
    defaults:
      run:
        working-directory: ./backend/bom-bom-server

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Docker 이미지 Pull
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/bom-bom:latest
          docker pull "$IMAGE"

      - name: 이미지 변경 여부 확인
        id: compare_digest
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/bom-bom:latest
          NEW=$(docker inspect --format='{{.Id}}' "$IMAGE")
          if docker inspect bombom-server-dev &>/dev/null; then
            CURRENT=$(docker inspect --format='{{.Image}}' bombom-server-dev)
          else
            CURRENT="not_found"
          fi
          echo "new_image_id=$NEW" >> $GITHUB_OUTPUT
          echo "current_image_id=$CURRENT" >> $GITHUB_OUTPUT
          if [ "$NEW" = "$CURRENT" ]; then
            echo "Image unchanged. Skipping deployment."
            echo "skip_deploy=true" >> $GITHUB_ENV
          else
            echo "skip_deploy=false" >> $GITHUB_ENV
          fi

      - name: .env 파일 생성
        run: |
          set -euo pipefail
          umask 077
          cat > .env <<EOF
          DEV_SPRING_DATASOURCE_URL=${{ secrets.DEV_SPRING_DATASOURCE_URL }}
          DEV_SPRING_DATASOURCE_USERNAME=${{ secrets.DEV_SPRING_DATASOURCE_USERNAME }}
          DEV_SPRING_DATASOURCE_PASSWORD=${{ secrets.DEV_SPRING_DATASOURCE_PASSWORD }}
          DEV_OTEL_ENDPOINT=${{ secrets.DEV_OTEL_ENDPOINT }}
          EOF

      - name: Discord 웹훅을 Parameter Store에서 가져오기
        run: |
          set -euo pipefail
          get_parameter() {
            aws ssm get-parameter \
              --name "/bom-bom/dev/$1" \
              --with-decryption \
              --query 'Parameter.Value' \
              --output text \
              --region ap-northeast-2
          }
          umask 077
          {
            printf 'DISCORD_WEBHOOK_NEW_MEMBER=%s\n' "$(get_parameter DISCORD_WEBHOOK_NEW_MEMBER)"
            printf 'DISCORD_WEBHOOK_OPERATION_ERROR=%s\n' "$(get_parameter DISCORD_WEBHOOK_OPERATION_ERROR)"
            printf 'DISCORD_WEBHOOK_INQUIRY=%s\n' "$(get_parameter DISCORD_WEBHOOK_INQUIRY)"
          } >> .env
          chmod 600 .env

      - name: 컨테이너 재실행 (Apple 키 환경변수 주입)
        shell: bash
        env:
          APPLE_P8_ESCAPED: ${{ secrets.APPLE_P8_ESCAPED }}
        run: |
          set -euo pipefail
          export OAUTH2_APPLE_PRIVATE_KEY="$(printf '%b' "$APPLE_P8_ESCAPED")"
          docker compose --env-file .env -f docker-compose-dev.yml config >/dev/null
          docker compose --env-file .env -f docker-compose-dev.yml down || true
          OAUTH2_APPLE_PRIVATE_KEY="$OAUTH2_APPLE_PRIVATE_KEY" \
          docker compose --env-file .env -f docker-compose-dev.yml up -d
          # compose 서비스에 environment: - OAUTH2_APPLE_PRIVATE_KEY 가 선언되어 있어야 컨테이너로 전달됩니다.

      - name: 배포 환경 파일 삭제
        if: always()
        run: rm -f .env

      - name: Docker 리소스 정리
        if: env.skip_deploy == 'false'
        run: |
          echo "Docker 리소스 정리 시작"
          docker container prune -f --filter "until=24h"
          docker image prune -f --filter "until=24h"
          echo "리소스 정리 완료"

name: pull requset - dev

on:
  pull_request:
    types: [ opened, edited, synchronize ]
    branches:
      - server-dev

jobs:
  dev-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend/bom-bom-server
    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK v21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 설정 파일 생성(메인/테스트)
        shell: bash
        env:
          APPLICATION_DEV_PROPERTIES: ${{ secrets.APPLICATION_DEV_PROPERTIES }}
          APPLICATION_TEST_PROPERTIES: ${{ secrets.APPLICATION_TEST_PROPERTIES }}
        run: |
          mkdir -p src/main/resources src/test/resources
          printf '%s' "${APPLICATION_DEV_PROPERTIES:-}" > src/main/resources/application.yml
          printf '%s' "$APPLICATION_TEST_PROPERTIES" > src/test/resources/application.yml

      - name: 빌드 및 테스트
        shell: bash
        env:
          SPRING_PROFILES_ACTIVE: test
          DISCORD_WEBHOOK_NEW_MEMBER: https://example.invalid/discord/discord_webhook_new_member
          DISCORD_WEBHOOK_OPERATION_ERROR: https://example.invalid/discord/discord_webhook_operation_error
          DISCORD_WEBHOOK_INQUIRY: ${{ secrets.DISCORD_WEBHOOK_INQUIRY_DEV_URL }}
          APPLE_P8_ESCAPED: ${{ secrets.APPLE_P8_ESCAPED }}
        run: |
          : "${DISCORD_WEBHOOK_INQUIRY:?DISCORD_WEBHOOK_INQUIRY_DEV_URL 시크릿이 없습니다}"
          export OAUTH2_APPLE_PRIVATE_KEY="$(printf '%b' "$APPLE_P8_ESCAPED")"
          ./gradlew build --no-daemon

      - name: 테스트 리포트 생성
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Test Report
          path: backend/bom-bom-server/build/test-results/test/*.xml
          reporter: java-junit

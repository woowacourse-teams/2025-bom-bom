name: Backend Email Server


on:
  push:
    branches:
      - email-server-dev

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/mail-server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Generate config files
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.EMAIL_APPLICATION_PROD_PROPERTIES }}" \
            > src/main/resources/application.yml
          echo "${{ secrets.EMAIL_APPLICATION_PROD_DOCKER_PROPERTIES }}" \
            > src/main/resources/application-docker.yml
          mkdir -p src/test/resources  
          echo "${{ secrets.EMAIL_APPLICATION_TEST_PROPERTIES }}" \
            > src/test/resources/application.yml

      - name: Remove legacy database credentials from generated config
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 scripts/remove-datasource-credentials.py \
            src/main/resources/application.yml \
            src/main/resources/application-docker.yml

      - name: Build JAR
        run: ./gradlew clean build

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.EMAIL_DOCKERHUB_USERNAME }}
          password: ${{ secrets.EMAIL_DOCKERHUB_TOKEN }}

      - name: Build & push Docker image
        run: |
          docker buildx build \
            --platform linux/arm64,linux/amd64 \
            --push \
            -t ${{ secrets.EMAIL_DOCKERHUB_USERNAME }}/bombom-email:latest \
            -t ${{ secrets.EMAIL_DOCKERHUB_USERNAME }}/bombom-email:${{ github.sha }} \
            .

  deploy:
    name: Deploy
    needs: build
    runs-on:
      - self-hosted
      - email
    env:
      MAIL_SERVER_INTERNAL_API_KEY: ${{ secrets.MAIL_SERVER_INTERNAL_API_KEY }}
      # 커밋 SHA 태그로 배포한다. 이전 배포 실행의 Deploy 작업을 다시 실행하면 그 버전으로 되돌아간다.
      EMAIL_IMAGE_TAG: ${{ github.sha }}
    defaults:
      run:
        working-directory: backend/mail-server

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.EMAIL_DOCKERHUB_USERNAME }}
          password: ${{ secrets.EMAIL_DOCKERHUB_TOKEN }}

      - name: Check Parameter Store access before stopping the server
        run: bash scripts/check-parameter-store.sh

      - name: Stop & Remove Previous Compose
        run: |
          docker compose down \
          --remove-orphans --volumes || true

      - name: Pull & Deploy with Docker Compose
        run: |
          docker compose pull mail-app
          docker compose up -d mail-app

      - name: Remove Old Images
        # 되돌리기용으로 최근 SHA 태그 3개만 남긴다. 실행 중인 이미지는 지워지지 않는다.
        run: |
          docker image prune -f
          docker images ryandia/bombom-email --format '{{.Tag}}' \
            | grep -vE '^(latest|<none>)$' \
            | tail -n +4 \
            | xargs -r -I{} docker rmi ryandia/bombom-email:{} || true

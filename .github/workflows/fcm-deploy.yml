name: Backend FCM Server Deploy

on:
  push:
    branches:
      - fcm-server

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/fcm-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: fcm application.yml 생성 (prod, test)
        env:
          PROD_YML: ${{ secrets.FCM_APPLICATION_PROD_YML }}
          TEST_YML: ${{ secrets.FCM_APPLICATION_TEST_YML }}
        run: |
          mkdir -p src/main/resources
          echo "$PROD_YML" > src/main/resources/application.yml
          mkdir -p src/test/resources
          echo "$TEST_YML" > src/test/resources/application.yml

          for key in SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD; do
            expected="\${$key}"
            if ! grep -Fq "$expected" src/main/resources/application.yml; then
              echo "FCM_APPLICATION_PROD_YML must reference $expected" >&2
              exit 1
            fi
          done

      - name: fcm reminder-messages.yml 생성
        env:
          REMINDER_MESSAGES: ${{ secrets.FCM_CHALLENGE_REMINDER_MESSAGES_YML }}
        run: |
          echo "$REMINDER_MESSAGES" > src/main/resources/reminder-messages.yml

      - name: Debug - check allowed-origins line
        run: |
          echo "===== allowed-origins in application.yml ====="
          grep -n "allowed-origins" src/main/resources/application.yml || echo "not found"

      - name: Build JAR
        run: ./gradlew clean build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image
        run: |
          docker buildx build \
            --platform linux/arm64,linux/amd64 \
            --push \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/bombom-fcm:latest \
            .

  deploy:
    name: Deploy
    needs: build
    runs-on: [ self-hosted, fcm ]
    defaults:
      run:
        working-directory: backend/fcm-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare config & key files
        run: |
          sudo mkdir -p /srv/bombom/secrets
          sudo mkdir -p /srv/bombom/logs

          printf '%s\n' "${{ secrets.FCM_GOOGLE_CREDENTIALS_JSON_BASE64 }}" \
            | base64 -d \
            | sudo tee /srv/bombom/secrets/bombom-fcm.json > /dev/null
          sudo chmod 644 /srv/bombom/secrets/bombom-fcm.json

      - name: Pull image & retag
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/bombom-fcm:latest
          docker tag  ${{ secrets.DOCKERHUB_USERNAME }}/bombom-fcm:latest bombom-fcm:latest

      - name: Deploy with Docker Compose
        env:
          AWS_REGION: ap-northeast-2
          FCM_DB_PARAMETER_PATH: /bom-bom/fcm/prod
        run: |
          set -euo pipefail

          get_parameter() {
            aws ssm get-parameter \
              --name "${FCM_DB_PARAMETER_PATH}/$1" \
              --with-decryption \
              --query 'Parameter.Value' \
              --output text \
              --region "$AWS_REGION"
          }

          export FCM_SPRING_DATASOURCE_URL="$(get_parameter SPRING_DATASOURCE_URL)"
          export FCM_SPRING_DATASOURCE_USERNAME="$(get_parameter SPRING_DATASOURCE_USERNAME)"
          export FCM_SPRING_DATASOURCE_PASSWORD="$(get_parameter SPRING_DATASOURCE_PASSWORD)"

          : "${FCM_SPRING_DATASOURCE_URL:?FCM SPRING_DATASOURCE_URL SSM parameter is empty}"
          : "${FCM_SPRING_DATASOURCE_USERNAME:?FCM SPRING_DATASOURCE_USERNAME SSM parameter is empty}"
          : "${FCM_SPRING_DATASOURCE_PASSWORD:?FCM SPRING_DATASOURCE_PASSWORD SSM parameter is empty}"

          # Fail before replacing the running container if config is incomplete.
          docker compose config >/dev/null
          docker compose up -d --remove-orphans --force-recreate fcm-app

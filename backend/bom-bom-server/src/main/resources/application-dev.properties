# dev 프로필의 보안 기본값. 비밀정보는 기존 YAML/환경변수 주입 경로에서 관리한다.
server.servlet.session.cookie.name=JSESSIONID_DEV
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
# 기존 클라이언트 호환성을 유지한다. 토큰 전송 연동 후 활성화한다.
app.security.csrf-enabled=false
app.cors.allowed-origins=https://dev.bombom.news,https://maeilmail.bombom.news,http://localhost:3000
app.auth.apple-request-cookie-name=__Host-BOMBOM_APPLE_AUTH_DEV

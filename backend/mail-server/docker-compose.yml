services:
  mail-app:
    image: ryandia/bombom-email:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    environment:
      INTEGRATION_MAILDIR: /maildir/new
      SPRING_PROFILES_ACTIVE: docker
      LOGGING_FILE_NAME: /logs/bombom-email.log
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_INTEGRATION: INFO
      # DB 연결을 못 얻으면 30초(기본값) 대신 3초 만에 실패시켜 스케줄러 스레드가 오래 묶이지 않게 한다.
      SPRING_DATASOURCE_HIKARI_CONNECTIONTIMEOUT: 3000
      # 일시적 오류로 in-progress 에 남은 메일을 30분 지나면 new 로 되돌리고, 10분마다 확인한다.
      MAILDIR_INPROGRESSSTALEMINUTES: 30
      MAILDIR_INPROGRESSREQUEUEINTERVALMS: 600000
      MAIL_SERVER_INTERNAL_API_KEY: ${MAIL_SERVER_INTERNAL_API_KEY:?MAIL_SERVER_INTERNAL_API_KEY is required}
    volumes:
      - /home/ec2-user/Maildir:/maildir
      - /home/ec2-user/bombom-email/logs:/logs 
    user: "1000:1000"
    ports:
      - "8080:8080"
